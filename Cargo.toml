[package]
name = "tnet-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
bytes = "1"
clap = { version = "4.0", features = ["derive"] }
toml = "0.7"
serde = { version = "1.0", features = ["derive"] }
url = "2.5.9"
percent-encoding = "2.3"
mlua = { version = "0.9", features = ["lua54", "send"] }
rhai = "1.19"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26.6"
rustls-pemfile = "2"
russh = { version = "0.65.2", default-features = false, features = ["ring", "flate2", "rsa"] }
rustls-native-certs = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[[bin]]
name = "utnp-server"
path = "src/server/main.rs"

[[bin]]
name = "utnp-client"
path = "src/client/main.rs"

[[bin]]
name = "tcurl"
path = "src/tcurl/main.rs"

[[bin]]
name = "tmutp-server"
path = "src/tmutp/main.rs"

[[bin]]
name = "tbip-server"
path = "src/tbip/main.rs"